[package]
name = "pathify-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line interface for Pathify."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["gps", "gpx", "cli", "geospatial", "fitness"]
categories = ["command-line-utilities", "science::geo"]
# Excluded rather than shipped broken: these integration tests reach for
# fixtures at the workspace root (`../../tests/fixtures`), which sits outside
# this crate and so cannot be packaged alongside it.
exclude = ["tests/*"]

[[bin]]
name = "pathify"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
pathify-core.workspace = true
pathify-render.workspace = true
pathify-tui.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
