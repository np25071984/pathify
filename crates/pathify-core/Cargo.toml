[package]
name = "pathify-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Trace model, format adapters, and spatial math for Pathify."

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
geo = "0.32.0"
geojson = "1.0.0"
gpx = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = "0.3"

[dev-dependencies]
proptest = "1.11.0"
